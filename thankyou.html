<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Sawa Repairs &amp; Solutions Kenya</title>
  <link rel="icon" type="image/svg+xml" href="images/sawa-logo-transparent.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --green: #1A4731;
      --orange: #E8720C;
      --orange-light: #F5943A;
      --dark: #0B120E;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: linear-gradient(135deg, var(--dark) 0%, #0E2018 60%, #180C02 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 5vw;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 3.8rem;
      color: var(--orange-light);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3rem);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    h1 em { color: var(--orange-light); font-style: italic; }
    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1.8rem;
      font-weight: 300;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .btn-wa {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.95rem 2rem;
      border-radius: 10px;
      width: 100%;
      max-width: 320px;
      transition: all 0.25s ease;
    }
    .btn-wa:hover { background: #1fb558; transform: translateY(-2px); }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.2s ease;
    }
    .btn-home:hover { color: white; border-color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-check-circle"></i></div>
    <h1>Request <em>Received!</em></h1>
    <p>Thank you for reaching out to Sawa Repairs. We have received your inquiry and will get back to you shortly. For immediate response, reach us directly on WhatsApp.</p>
    <div class="actions">
      <a href="https://wa.me/254797846126" class="btn-wa" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>
      <a href="index.html" class="btn-home"><i class="fas fa-arrow-left"></i> Return to Homepage</a>
    </div>
  </div>
</body>
</html>
